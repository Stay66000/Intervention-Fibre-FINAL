name: Compact tariff actions
on:
  push:
    branches:
      - ui/compact-tariff-actions
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compact tariff and supplement rows
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          old=".tariff-operator{border:1px solid var(--line);border-radius:15px;padding:13px;background:var(--surface-alt);margin-bottom:10px}.tariff-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.tariff-row{display:grid;grid-template-columns:1fr 112px auto;gap:7px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}.tariff-row:first-of-type{border-top:0}.tariff-row input{min-height:38px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}.tariff-add{display:grid;grid-template-columns:1fr 112px auto;gap:7px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-strong)}"
          new=".tariff-operator{border:1px solid var(--line);border-radius:15px;padding:13px;background:var(--surface-alt);margin-bottom:10px}.tariff-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.tariff-row{display:grid;grid-template-columns:minmax(110px,220px) 88px auto auto;gap:6px;align-items:center;justify-content:start;padding:7px 0;border-top:1px solid var(--line)}.tariff-row:first-of-type{border-top:0}.tariff-row input{min-height:36px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}.tariff-row .tr-name{max-width:220px}.tariff-row .tr-amount{max-width:88px;font-family:var(--font-num);font-variant-numeric:tabular-nums}.tariff-row .btn-ghost{min-height:34px;padding:5px 8px;white-space:nowrap}.tariff-row [data-type-action]{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-text)}.tariff-row [data-type-delete]{border-color:color-mix(in srgb,var(--danger) 32%,var(--line));background:var(--danger-bg)}.tariff-add{display:grid;grid-template-columns:minmax(110px,220px) 88px auto;gap:6px;justify-content:start;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-strong)}"
          if old not in s:
              raise SystemExit('tariff css block not found')
          s=s.replace(old,new,1)
          old_mobile="@media(max-width:520px){.gate{padding:14px 10px 36px}.gate-card{padding:16px}.operator-grid{grid-template-columns:1fr}.theme-choices{grid-template-columns:1fr}.type-row{grid-template-columns:1fr 105px 38px}.tariff-row,.tariff-add{grid-template-columns:1fr 94px auto}}"
          new_mobile="@media(max-width:520px){.gate{padding:14px 10px 36px}.gate-card{padding:16px}.operator-grid{grid-template-columns:1fr}.theme-choices{grid-template-columns:1fr}.type-row{grid-template-columns:1fr 105px 38px}.tariff-row{grid-template-columns:minmax(84px,1fr) 70px auto auto;gap:4px}.tariff-row .btn-ghost{font-size:11.5px;padding:5px 6px}.tariff-add{grid-template-columns:minmax(100px,1fr) 70px auto;gap:5px}}"
          if old_mobile not in s:
              raise SystemExit('mobile tariff css block not found')
          s=s.replace(old_mobile,new_mobile,1)
          old_company=".company-type-row{grid-template-columns:minmax(150px,1fr) 120px auto}.company-tariff-row{grid-template-columns:minmax(150px,1fr) 110px 120px auto}"
          new_company=".company-type-row{grid-template-columns:minmax(120px,220px) 90px auto;justify-content:start}.company-tariff-row{grid-template-columns:minmax(150px,1fr) 110px 120px auto}"
          if old_company in s:
              s=s.replace(old_company,new_company,1)
          old_actions=".company-admin-mini-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}"
          new_actions=".company-admin-mini-actions{display:flex;gap:5px;flex-wrap:nowrap;justify-content:flex-end}.company-admin-mini-actions .btn-ghost{padding:5px 8px;white-space:nowrap}"
          if old_actions in s:
              s=s.replace(old_actions,new_actions,1)
          p.write_text(s)

          p=Path('supplement-presets.js')
          s=p.read_text()
          s=s.replace(".supp-rate-row{display:grid;grid-template-columns:minmax(0,1fr) 105px auto auto auto;gap:7px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}",
                      ".supp-rate-row{display:grid;grid-template-columns:minmax(110px,220px) 88px auto auto auto;gap:6px;align-items:center;justify-content:start;padding:7px 0;border-top:1px solid var(--line)}")
          s=s.replace(".supp-rate-row input,.supp-rate-add input{width:100%;min-height:38px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}",
                      ".supp-rate-row input,.supp-rate-add input{width:100%;min-height:36px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}\n      .supp-rate-row .supp-name{max-width:220px}.supp-rate-row .supp-amount{max-width:88px;font-family:var(--font-num)}.supp-rate-row .btn-ghost{min-height:34px;padding:5px 8px;white-space:nowrap}")
          p.write_text(s)
          PY
          node --check supplement-presets.js
          rm .github/workflows/compact-tariff-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supplement-presets.js .github/workflows/compact-tariff-actions.yml
          git commit -m "Compacte les lignes de tarifs et leurs actions"
          git push
