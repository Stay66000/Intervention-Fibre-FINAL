name: Connect FIBRE OPS to Sheets TEST

on:
  push:
    branches:
      - fix/connect-main-to-test-sheet

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/connect-main-to-test-sheet

      - name: Patch FIBRE OPS and Sheets TEST loader
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "<script>\nconst SUPABASE_URL="
          block = """<!-- FIBRE OPS TEST · pont Google Sheets sandbox uniquement -->
          <script>
          try{localStorage.setItem('fibre_ops_sheets_sandbox_enabled_v2','1')}catch(e){}
          </script>
          <script id="fibreSandboxAddressFixMain" src="./sandbox-address-fix.js?v=4&build=13"></script>
          <script id="fibreSheetsBridgeScriptMain" src="./sheets-bridge.js?v=4&build=13"></script>
          <script id="fibreSheetsPullScriptMain" src="./sheets-pull.js?v=10&build=13"></script>
          <!-- /FIBRE OPS TEST -->
          """
          if 'fibreSheetsBridgeScriptMain' not in s:
              if marker not in s:
                  raise SystemExit('Marker Supabase introuvable dans index.html')
              s = s.replace(marker, block + marker, 1)
          s = s.replace('V3 Production 1.2', 'V3 Production 1.3')
          p.write_text(s, encoding='utf-8')

          q = Path('sheets-pull.js')
          t = q.read_text(encoding='utf-8')
          old = "function start(){if(!ensureUi()){setTimeout(start,400);return}if(!canUse()){setStatus('Sandbox réservé au compte principal dans son espace personnel solo.');return}setStatus('Prêt · compare d’abord, puis importe uniquement les lignes sûres.')}"
          new = "function start(){if(!ensureUi()){setTimeout(start,400);return}if(!canUse()){setStatus('Connexion au compte principal…');setTimeout(start,800);return}setStatus('Prêt · FIBRE OPS est relié au classeur TEST. Compare d’abord, puis importe uniquement les lignes sûres.')}"
          if old not in t:
              raise SystemExit('Fonction start attendue introuvable dans sheets-pull.js')
          t = t.replace(old, new, 1)
          q.write_text(t, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -q 'fibreSheetsBridgeScriptMain' index.html
          grep -q 'V3 Production 1.3' index.html
          grep -q 'Connexion au compte principal' sheets-pull.js
          ! grep -q 'AKfycbxyJrikE3tF9uaiuMmJtGq8OafETWuLX354Zv6gufGWKX26NXxPNMMFX7p--rlIMWak1Q' sheets-bridge.js
          grep -q 'AKfycbwM6g4kJWdwFKGhj_4Jt77gMjnlH4khqFapjuWnb00EgZMbpLXlmO8tdKYl0gLXCIks' sheets-bridge.js

      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/connect-sheets-test.yml
          git add index.html sheets-pull.js .github/workflows/connect-sheets-test.yml
          git commit -m "Connecte FIBRE OPS au classeur Sheets TEST"
          git push origin HEAD:fix/connect-main-to-test-sheet
