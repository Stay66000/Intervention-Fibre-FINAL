name: Fix saved supplement loader position

on:
  push:
    branches:
      - feature/saved-supplement-tariffs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/saved-supplement-tariffs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix loader position
        run: node tools/fix-saved-supplement-loader-position.cjs
      - name: Validate JS
        run: node --check supplement-presets.js
      - name: Remove temporary tooling
        run: |
          rm -f tools/fix-saved-supplement-loader-position.cjs
          rm -f .github/workflows/fix-saved-supplement-loader-position.yml
      - name: Commit fixed loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supplement-presets.js tools/fix-saved-supplement-loader-position.cjs .github/workflows/fix-saved-supplement-loader-position.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Charge les compléments après le moteur principal"
          git push origin HEAD:feature/saved-supplement-tariffs
