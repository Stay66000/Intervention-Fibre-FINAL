name: Patch hard delete catalog
on:
  push:
    branches:
      - feature/hard-delete-catalog
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch catalog deletion UI
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()

          old='''<button type="button" class="btn-ghost" data-type-action="${t.id}">${t.active?'Sauver':'Réactiver'}</button></div>'''
          new='''<button type="button" class="btn-ghost" data-type-action="${t.id}">${t.active?'Sauver':'Réactiver'}</button><button type="button" class="btn-ghost" style="color:var(--danger)" data-type-delete="${t.id}">Supprimer</button></div>'''
          if s.count(old)!=1:
              raise SystemExit(f'standard tariff row target count={s.count(old)}')
          s=s.replace(old,new,1)

          old="""$('tariffRows').addEventListener('click',async e=>{if(isCompanyTechnician())return;const act=e.target.closest('[data-type-action]');"""
          new="""$('tariffRows').addEventListener('click',async e=>{if(isCompanyTechnician())return;const del=e.target.closest('[data-type-delete]');if(del){const t=types.find(x=>x.id===del.dataset.typeDelete);if(!t)return;const ok=confirm(`Supprimer définitivement la typologie “${t.name}” du catalogue ?\\n\\nLes interventions déjà enregistrées garderont leur typologie et leur montant.`);if(!ok)return;del.disabled=true;const {error}=await supabase.rpc('delete_intervention_type',{p_type_id:t.id});if(error){del.disabled=false;return toast('Erreur suppression : '+error.message)}types=types.filter(x=>x.id!==t.id);populateOperatorUI();renderTariffs();return toast('🗑️ Typologie supprimée · historique conservé')}const act=e.target.closest('[data-type-action]');"""
          if s.count(old)!=1:
              raise SystemExit(f'tariff listener target count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''<button type="button" class="btn-ghost" data-company-type-toggle="${t.id}" data-next-active="${t.active?'false':'true'}">${t.active?'Désactiver':'Réactiver'}</button></div></div>'''
          new='''<button type="button" class="btn-ghost" data-company-type-toggle="${t.id}" data-next-active="${t.active?'false':'true'}">${t.active?'Désactiver':'Réactiver'}</button><button type="button" class="btn-ghost" style="color:var(--danger)" data-company-type-delete="${t.id}">Supprimer</button></div></div>'''
          if s.count(old)!=1:
              raise SystemExit(f'company tariff row target count={s.count(old)}')
          s=s.replace(old,new,1)

          old="""$('companyTypeList').addEventListener('click',async e=>{const save="""
          new="""$('companyTypeList').addEventListener('click',async e=>{const del=e.target.closest('[data-company-type-delete]');if(del){const type=companyTypes.find(t=>t.id===del.dataset.companyTypeDelete);if(!type)return;const ok=confirm(`Supprimer définitivement la typologie “${type.name}” du catalogue société ?\\n\\nLes anciennes interventions conserveront leur nom de typologie et leurs montants. Les tarifs techniciens actuels liés à cette typologie seront aussi retirés.`);if(!ok)return;del.disabled=true;const {error}=await supabase.rpc('delete_intervention_type',{p_type_id:type.id});if(error){del.disabled=false;return toast('Erreur suppression : '+error.message)}await refreshCompanyAdminTools();return toast('🗑️ Typologie société supprimée · historique conservé')}const save="""
          if s.count(old)!=1:
              raise SystemExit(f'company listener target count={s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s)

          p=Path('supplement-presets.js')
          s=p.read_text()
          old='.supp-rate-row{display:grid;grid-template-columns:minmax(0,1fr) 105px auto auto;gap:7px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}'
          new='.supp-rate-row{display:grid;grid-template-columns:minmax(0,1fr) 105px auto auto auto;gap:7px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}'
          if s.count(old)!=1:
              raise SystemExit(f'supp grid target count={s.count(old)}')
          s=s.replace(old,new,1)

          old='.supp-rate-row .supp-save,.supp-rate-row .supp-toggle{grid-row:2}'
          new='.supp-rate-row .supp-save,.supp-rate-row .supp-toggle,.supp-rate-row .supp-delete{grid-row:2}'
          if s.count(old)!=1:
              raise SystemExit(f'supp mobile target count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''<button class="btn-ghost supp-toggle" type="button" data-supp-toggle="${x.id}">${x.active?'Désactiver':'Réactiver'}</button>'''
          new='''<button class="btn-ghost supp-toggle" type="button" data-supp-toggle="${x.id}">${x.active?'Désactiver':'Réactiver'}</button>\n            <button class="btn-ghost supp-delete" style="color:var(--danger)" type="button" data-supp-delete="${x.id}">Supprimer</button>'''
          if s.count(old)!=1:
              raise SystemExit(f'supp row target count={s.count(old)}')
          s=s.replace(old,new,1)

          marker='''  async function togglePreset(id){'''
          insert='''  async function deletePreset(id){\n    const p=currentRows().find(x=>x.id===id);if(!p)return;\n    const ok=confirm(`Supprimer définitivement le complément “${p.name}” du catalogue ?\\n\\nLes interventions déjà enregistrées garderont ce complément et son montant.`);\n    if(!ok)return;\n    const {error}=await supabase.rpc('delete_intervention_supplement_type',{p_supplement_id:id});\n    if(error)return toast('Erreur suppression : '+error.message);\n    supplementPresets=supplementPresets.filter(x=>x.id!==id);\n    try{renderTariffs()}catch{refreshUi()}\n    renderPresetButtons('f');renderPresetButtons('m');\n    toast('🗑️ Complément supprimé · historique conservé');\n  }\n\n'''
          if s.count(marker)!=1:
              raise SystemExit(f'supp toggle marker count={s.count(marker)}')
          s=s.replace(marker,insert+marker,1)

          old="""    const toggle=e.target.closest('[data-supp-toggle]');\n    if(toggle){e.preventDefault();togglePreset(toggle.dataset.suppToggle);return;}"""
          new="""    const toggle=e.target.closest('[data-supp-toggle]');\n    if(toggle){e.preventDefault();togglePreset(toggle.dataset.suppToggle);return;}\n    const del=e.target.closest('[data-supp-delete]');\n    if(del){e.preventDefault();deletePreset(del.dataset.suppDelete);return;}"""
          if s.count(old)!=1:
              raise SystemExit(f'supp click target count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          node --check supplement-presets.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(scripts):
              if not code.strip(): continue
              f=Path(f'/tmp/fibre_inline_{i}.js')
              f.write_text(code)
              subprocess.run(['node','--check',str(f)],check=True)
          print('inline scripts OK:',len(scripts))
          PY

          git rm .github/workflows/patch-hard-delete-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supplement-presets.js
          git commit -m "Ajoute la suppression réelle des typologies et compléments"
          git push
