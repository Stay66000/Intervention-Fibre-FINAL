name: Remove Sheets sandbox UI

on:
  push:
    branches:
      - fix/remove-sheets-sandbox-ui
    paths:
      - '.github/workflows/remove-sheets-sandbox-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-sheets-sandbox-ui
      - name: Disable sandbox import UI only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sheets-pull.js')
          s=p.read_text()
          old='  start();\n})();\n'
          new="  // Interface d'import TEST retirée de la version visible.\n  // Le bridge Sheets sortant reste géré séparément par sheets-bridge.js.\n  const oldBlock=document.getElementById('sheetsSandboxBlock');\n  if(oldBlock)oldBlock.remove();\n})();\n"
          if old not in s:
              raise SystemExit('start marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/remove-sheets-sandbox-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheets-pull.js .github/workflows/remove-sheets-sandbox-ui.yml
          git commit -m "Retire l’interface Sheets sandbox des réglages"
          git push origin HEAD:fix/remove-sheets-sandbox-ui
