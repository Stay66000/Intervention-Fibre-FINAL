name: Fix operator supplements toggle
on:
  push:
    branches:
      - fix/operator-supplements-toggle-rpc
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch secure toggle RPC
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supplement-presets.js')
          s=p.read_text()
          old="""  async function setOperatorFeature(op,next){
    if(!canUseCatalog()||!op)return;
    let q=supabase.from('user_operators').update({supplements_enabled:next}).eq('operator',op);
    if(hasTeam())q=q.eq('team_id',team.id);
    else q=q.eq('user_id',user.id).is('team_id',null);
    const {data,error}=await q.select('user_id,team_id,operator,supplements_enabled');
    if(error)return toast('Erreur complément : '+error.message);
    if(!Array.isArray(data)||!data.length)return toast('Configuration opérateur introuvable');
    await loadPresets({rerender:true});
"""
          new="""  async function setOperatorFeature(op,next){
    if(!canUseCatalog()||!op)return;
    const {error}=await supabase.rpc('set_operator_supplements_enabled',{p_operator:op,p_enabled:next});
    if(error)return toast('Erreur complément : '+error.message);
    await loadPresets({rerender:true});
"""
          if old not in s:
              raise SystemExit('Target block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check supplement-presets.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supplement-presets.js
          git commit -m "Sécurise l’activation des compléments par RPC"
          git push
