<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f141b">
<title>FIBRE OPS — Sandbox Sheets v12</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f141b}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0f141b}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#eef2f7;font:600 14px system-ui;background:#0f141b;z-index:2;padding:24px;text-align:center}
#version{position:fixed;top:8px;right:8px;z-index:9;background:#35d0e0;color:#052a31;padding:5px 8px;border-radius:8px;font:700 11px system-ui;box-shadow:0 2px 8px #0005}
</style>
</head>
<body>
<div id="version">SANDBOX v12 · Sheets preload</div>
<div id="boot">Chargement FIBRE OPS · pont Sheets TEST avant Supabase…</div>
<iframe id="app" title="FIBRE OPS"></iframe>
<script>
const sandboxNonce=document.currentScript.nonce;
(async()=>{
  const frame=document.getElementById('app');
  const boot=document.getElementById('boot');
  try{
    // Le sandbox est le seul endroit où le pont TEST est activé.
    localStorage.setItem('fibre_ops_sheets_sandbox_enabled_v2','1');

    // On récupère FIBRE OPS comme texte puis on précharge les ponts AVANT le script principal.
    // Ainsi Supabase est créé avec window.fetch déjà instrumenté pour le sandbox.
    const response=await fetch('./index.html?sheets-sandbox-source=1&build=12',{cache:'no-store'});
    if(!response.ok)throw new Error('index.html HTTP '+response.status);
    let html=await response.text();
    if(!html.includes('</head>'))throw new Error('Balise </head> introuvable');

    const preload=`
<script nonce="${sandboxNonce}">try{localStorage.setItem('fibre_ops_sheets_sandbox_enabled_v2','1')}catch(e){}<\/script>
<script nonce="${sandboxNonce}" id="fibreSandboxAddressFix" src="./sandbox-address-fix.js?v=3&build=12"><\/script>
<script nonce="${sandboxNonce}" id="fibreSheetsBridgeScript" src="./sheets-bridge.js?v=3&build=12"><\/script>
<script nonce="${sandboxNonce}" id="fibreSheetsPullScript" src="./sheets-pull.js?v=9&build=12"><\/script>
`;

    // srcdoc inherits this page's CSP, so reuse the parent's nonce.
    html=html.replace(/nonce="[^"]*"/g,'nonce="'+sandboxNonce+'"');
    html=html.replace('</head>',preload+'\n</head>');
    frame.addEventListener('load',()=>{boot.style.display='none'},{once:true});
    frame.srcdoc=html;
  }catch(err){
    console.error('[Sheets sandbox preload]',err);
    boot.textContent='Impossible de démarrer FIBRE OPS TEST : '+String(err?.message||err);
  }
})();
</script>
</body>
</html>
